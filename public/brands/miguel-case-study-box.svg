<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="miguel-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="60%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas -->
  <rect width="800" height="800" fill="url(#miguel-bg)"/>
  <rect width="800" height="800" fill="url(#cyan-glow)"/>

  <!-- Architectural Subtle Grid -->
  <g stroke="rgba(255, 255, 255, 0.025)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- Center Card -->
  <rect x="130" y="200" width="540" height="400" rx="36" fill="#0c1424" filter="url(#cardGlow)" stroke="url(#cardBorder)" stroke-width="2"/>

  <!-- Clinic AI Emblem -->
  <g transform="translate(400, 310)">
    <!-- Outer Pulsing Hexagon Ring -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
    <!-- Medical Tech Cross in Center -->
    <rect x="-10" y="-32" width="20" height="64" rx="6" fill="url(#accentGradient)"/>
    <rect x="-32" y="-10" width="64" height="20" rx="6" fill="url(#accentGradient)"/>
    <!-- Center Node Core -->
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <!-- Orbiting Data Nodes -->
    <circle cx="-38" cy="-22" r="3.5" fill="#34d399"/>
    <circle cx="38" cy="-22" r="3.5" fill="#34d399"/>
    <circle cx="0" cy="46" r="3.5" fill="#34d399"/>
  </g>

  <!-- Brand Typography -->
  <!-- Name -->
  <text x="400" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    MIGUEL
  </text>
  
  <!-- Sub-title: Aesthetic Clinic Lead OS -->
  <text x="400" y="456" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="url(#accentGradient)" text-anchor="middle" letter-spacing="3.5">
    CLINIC LEAD GENERATION
  </text>

  <!-- Badge Line -->
  <g transform="translate(400, 505)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1"/>
    <circle cx="-116" cy="0" r="4" fill="#34d399"/>
    <text x="-100" y="5" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1">
      AI OUTBOUND &amp; BANT PIPELINE
    </text>
  </g>
</svg>

