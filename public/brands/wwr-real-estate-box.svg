<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wwr-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#190e2b"/>
      <stop offset="60%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#06040c"/>
    </radialGradient>
    <radialGradient id="qatar-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8a1538" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8a1538" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#d4af37" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8a1538" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="qatarMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas -->
  <rect width="800" height="800" fill="url(#wwr-bg)"/>
  <rect width="800" height="800" fill="url(#qatar-glow)"/>

  <!-- Architectural Subtle Grid -->
  <g stroke="rgba(255, 255, 255, 0.025)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- Center Card -->
  <rect x="130" y="190" width="540" height="420" rx="36" fill="#0d0a18" filter="url(#cardGlow)" stroke="url(#cardBorder)" stroke-width="2"/>

  <!-- Architectural Real Estate AI Emblem -->
  <g transform="translate(400, 295)">
    <!-- Skyscraper / Tower Facets -->
    <polygon points="-40,40 -20,-45 0,-60 -20,40" fill="url(#goldGradient)" opacity="0.85"/>
    <polygon points="0,-60 20,-45 40,40 20,40" fill="url(#goldGradient)" opacity="0.6"/>
    <polygon points="-16,-40 0,-52 16,-40 0,35" fill="#ffffff" opacity="0.25"/>

    <!-- Neural Automation Orbital Ring -->
    <ellipse cx="0" cy="10" rx="60" ry="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" stroke-dasharray="6,4"/>
    <circle cx="-56" cy="16" r="4" fill="#38bdf8"/>
    <circle cx="56" cy="4" r="4" fill="#facc15"/>
    <circle cx="0" cy="-60" r="5" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="415" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    WWR QATAR
  </text>
  
  <text x="400" y="452" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="3.5">
    WORLD WIDE REAL ESTATE
  </text>

  <!-- Badge Line -->
  <g transform="translate(400, 505)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="rgba(212, 175, 55, 0.08)" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
    <circle cx="-136" cy="0" r="4" fill="#34d399"/>
    <text x="-120" y="5" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1">
      AI SALES ENGINE · ZOHO CRM
    </text>
  </g>

  <!-- Secondary Meta Tag -->
  <text x="400" y="560" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    DOHA, QATAR · 3,200 LEADS RECOVERED · +34% SITE VISITS
  </text>
</svg>
